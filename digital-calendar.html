<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Calendar</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .calendar {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 360px;
      padding: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .calendar-header button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      color: #000;
    }

    .calendar-dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 5px;
    }

    .calendar-dates div {
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .calendar-dates div:hover {
      background-color: #e0f7fa;
    }

    .today {
      background-color: #007BFF !important;
      color: white !important;
      font-weight: bold;
    }

    .selected {
      background-color: #ff3c00 !important;
      /* Màu cam đậm */
      color: white !important;
      font-weight: bold;
    }

    /* Thêm style cho ngày của tháng khác */
    .other-month {
      color: #888888;
    }

    #goToday {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    #goToday:hover {
      background-color: #0056b3;
    }

    #timeDisplay {
      margin-top: 15px;
      font-size: 18px;
      color: #333;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="calendar">
    <div class="calendar-header">
      <button id="prev">&#9664;</button>
      <h2 id="monthYear"></h2>
      <button id="next">&#9654;</button>
    </div>
    <div class="calendar-days">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>
    <div class="calendar-dates" id="calendarDates"></div>
    <button id="goToday">Xem ngày hôm nay</button>
    <div id="timeDisplay"></div>
  </div>

  <script>
    const calendarDates = document.getElementById('calendarDates');
    const monthYear = document.getElementById('monthYear');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const timeDisplay = document.getElementById('timeDisplay');
    const goTodayBtn = document.getElementById('goToday');

    let currentDate = new Date();
    let selectedCell = null;

    function handleDayClick(dayDiv) {
      if (selectedCell) selectedCell.classList.remove('selected');
      if (!dayDiv.classList.contains('today')) {
        dayDiv.classList.add('selected');
        selectedCell = dayDiv;
      } else {
        selectedCell = null;
      }
    }

    // function handleDayClick(dayDiv) {
    //   if (selectedCell) {
    //     selectedCell.classList.remove('selected');
    //   }

    //   dayDiv.classList.add('selected');

    //   selectedCell = dayDiv;
    // }


    function renderCalendar(date) {
      calendarDates.innerHTML = '';

      const year = date.getFullYear();
      const month = date.getMonth();

      monthYear.textContent = date.toLocaleString('default', { month: 'long', year: 'numeric' });

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();
      const lastDateOfPrevMonth = new Date(year, month, 0).getDate();

      const today = new Date();

      // 1. In các ngày của tháng trước để lấp đầy khoảng trống đầu
      for (let i = firstDayOfMonth; i > 0; i--) {
        const dayDiv = document.createElement('div');
        dayDiv.textContent = lastDateOfPrevMonth - i + 1;
        dayDiv.classList.add('other-month');
        dayDiv.addEventListener('click', () => handleDayClick(dayDiv));
        calendarDates.appendChild(dayDiv);
      }

      // 2. In các ngày của tháng hiện tại
      for (let day = 1; day <= lastDateOfMonth; day++) {
        const dayDiv = document.createElement('div');
        dayDiv.textContent = day;

        if (
          day === today.getDate() &&
          month === today.getMonth() &&
          year === today.getFullYear()
        ) {
          dayDiv.classList.add('today');
        }

        dayDiv.addEventListener('click', () => handleDayClick(dayDiv));
        calendarDates.appendChild(dayDiv);
      }

      // 3. In các ngày của tháng sau để lấp đầy bảng (chuẩn 42 ô cho 6 hàng)
      const totalCells = firstDayOfMonth + lastDateOfMonth;
      const remainingCells = 42 - totalCells;

      for (let j = 1; j <= remainingCells; j++) {
        const dayDiv = document.createElement('div');
        dayDiv.textContent = j;
        dayDiv.classList.add('other-month');
        dayDiv.addEventListener('click', () => handleDayClick(dayDiv));
        calendarDates.appendChild(dayDiv);
      }
    }

    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar(currentDate);
      clearSelection();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar(currentDate);
      clearSelection();
    });

    goTodayBtn.addEventListener('click', () => {
      currentDate = new Date();
      renderCalendar(currentDate);
      clearSelection();
    });

    function clearSelection() {
      if (selectedCell) {
        selectedCell.classList.remove('selected');
        selectedCell = null;
      }
    }

    function updateTime() {
      const now = new Date();
      timeDisplay.textContent = now.toLocaleTimeString();
    }

    renderCalendar(currentDate);
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>

</html>
