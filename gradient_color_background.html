<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Color Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: linear-gradient(135deg,
                    #ff8a00 0%,
                    #ff4fa3 50%,
                    #8b5cf6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: white;
            font-size: 4rem;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>

</body>

</html>
